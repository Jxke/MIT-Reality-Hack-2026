services:
  whisper-stt:
    build: ./whisper
    network_mode: host
    volumes:
      - ./whisper/models:/models:ro
    command: >
      /app/build/bin/whisper-server
      --host 0.0.0.0
      --port 8080
      --model /models/${WHISPER_MODEL}
      --threads 4
    restart: unless-stopped

  pipeline:
    build: ./pipeline
    network_mode: host
    depends_on:
      - whisper-stt
    environment:
      - USE_ARDUINO_MIC=${USE_ARDUINO_MIC}
      - WHISPER_URL=http://localhost:8080
      - ARDUINO_SOCKET=${ARDUINO_SOCKET}
      - AR_HOST=0.0.0.0
      - AR_PORT=${AR_PORT}
      - POLL_INTERVAL=${POLL_INTERVAL}
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    volumes:
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
      - /var/run/arduino-router.sock:/var/run/arduino-router.sock
    restart: unless-stopped
